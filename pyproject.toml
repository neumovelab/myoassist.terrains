[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myoassist-terrains"
version = "0.2.0"
description = "Modular procedural terrain generator for MuJoCo musculoskeletal simulation, designed to be consumed by MyoAssist."
readme = "README.md"
authors = [{ name = "NeuMove Laboratory, Northeastern University" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["mujoco", "terrain", "procedural-generation", "musculoskeletal", "robotics", "biomechanics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "mujoco>=3.3.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "Pillow>=9.0",
]

[project.optional-dependencies]
render = [
    "mediapy>=1.2",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff==0.15.20",  # pinned: ruff's formatter changes between minor releases; keep CI == local
]

[project.scripts]
myoassist-terrains = "myoassist_terrains.cli:main"

[project.urls]
Homepage = "https://github.com/neumovelab/myoassist.terrains"
Issues = "https://github.com/neumovelab/myoassist.terrains/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["myoassist_terrains*"]

[tool.coverage.run]
source = ["myoassist_terrains"]
branch = true

[tool.coverage.report]
# Reported, not gated. cli.py and paths.py went from no coverage at all to covered
# in this pass, so the trend is the useful signal; a fixed floor mostly blocks the
# next contributor over an arbitrary number.
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

# Lint/format config. Line length and the E/F/W core match assist_sim and myo_sim so
# tooling is consistent across the repos; `I` matches myo_sim, which already sorts
# imports. `ARG` is on because four dead parameters survived review here -- one of
# them, `rough`'s `asset_path_prefix`, looked like a control over the emitted asset
# path and did nothing.
[tool.ruff]
line-length = 128
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["myoassist_terrains"]

[tool.ruff.lint.per-file-ignores]
# Test doubles have to match the signature the registry calls them with, so their
# unused parameters are the point rather than an oversight.
"tests/*.py" = ["ARG001"]

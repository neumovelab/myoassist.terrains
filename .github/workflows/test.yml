name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install myoassist.terrains + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and format check (ruff)
        run: ruff check . && ruff format --check .

      - name: Run tests
        run: pytest -q

      - name: Verify package builds cleanly
        if: matrix.python-version == '3.12'
        run: |
          pip install build
          python -m build --wheel
          python -c "
          import glob, zipfile
          whl = glob.glob('dist/myoassist_terrains-*.whl')[0]
          with zipfile.ZipFile(whl) as z:
              names = z.namelist()
          assert any(n.endswith('.py') for n in names), 'no python modules in wheel'
          print(f'Wheel OK: {len(names)} files')
          "
